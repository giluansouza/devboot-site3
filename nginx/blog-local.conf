# Temporary HTTPS tunnel for ChatGPT tests. No administrative API is exposed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256k;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /blog { return 308 /blog/; }
    location /blog/ { proxy_pass http://blog:8000; }
    location = /mcp {
        proxy_pass http://blog:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location /.well-known/oauth-protected-resource { proxy_pass http://blog:8000; }
    # RFC 8414 discovery places the well-known segment before the issuer path.
    location = /.well-known/oauth-authorization-server/auth/realms/devboot {
        proxy_pass http://auth:8080/auth/realms/devboot/.well-known/openid-configuration;
    }
    location = /.well-known/openid-configuration/auth/realms/devboot {
        proxy_pass http://auth:8080/auth/realms/devboot/.well-known/openid-configuration;
    }
    location ~ ^/auth/realms/devboot/(clients-registrations|account)(/|$) { return 404; }
    location /auth/realms/devboot/ { proxy_pass http://auth:8080; }
    location /auth/resources/ { proxy_pass http://auth:8080; }
    location /auth/ { return 404; }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
