server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256k;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # The landing must not depend on the blog container. A static `proxy_pass http://blog:8000`
    # resolves the name at startup, so nginx refuses to start while the blog is absent, and keeps
    # the old address after the blog is recreated. A variable in proxy_pass defers resolution to
    # request time, through Docker's embedded DNS. Without a URI in the variable, the request URI
    # reaches the app exactly as the client sent it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $blog_upstream http://blog:8000;

    location = /blog { return 308 /blog/; }
    location /blog/ {
        proxy_pass $blog_upstream;
        error_page 502 503 504 /blog-down.html;
    }
    location = /blog-down.html { internal; }
    location = /api/blog { proxy_pass $blog_upstream; }
    location /api/blog/ { proxy_pass $blog_upstream; }
    location = /mcp {
        proxy_pass $blog_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location /.well-known/oauth-protected-resource {
        proxy_pass $blog_upstream;
    }
    location / { try_files $uri $uri/ =404; }
}
