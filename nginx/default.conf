server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256k;
    # Behind Traefik nginx sees plain http: keep redirects relative so they keep the public scheme.
    absolute_redirect off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # The landing must not depend on the blog container. A static `proxy_pass http://blog:8000`
    # resolves the name at startup, so nginx refuses to start while the blog is absent, and keeps
    # the old address after the blog is recreated. A variable in proxy_pass defers resolution to
    # request time, through Docker's embedded DNS. Without a URI in the variable, the request URI
    # reaches the app exactly as the client sent it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $blog_upstream http://blog:8000;

    location = /blog { return 308 /blog/; }
    location /blog/ {
        proxy_pass $blog_upstream;
        error_page 502 503 504 /blog-down.html;
    }
    location = /blog-down.html { internal; }
    location = /api/blog { proxy_pass $blog_upstream; }
    location /api/blog/ { proxy_pass $blog_upstream; }
    location = /mcp {
        proxy_pass $blog_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location /.well-known/oauth-protected-resource {
        proxy_pass $blog_upstream;
    }
    # The shop is static (public/loja/, generated by loja/gerar.py). An unknown address answers
    # 404 with the shop's own page. Redirects stay relative through the server-wide
    # absolute_redirect off, which keeps the public scheme behind Traefik.
    location = /loja { return 308 /loja/; }
    location /loja/ {
        try_files $uri $uri/ =404;
        error_page 404 /loja/404.html;
    }
    location = /loja/404.html { internal; }
    location / { try_files $uri $uri/ =404; }
}
