services:
  web:
    image: nginx:stable-alpine
    container_name: devboot-site
    # Site principal (devboot.com.br). Rodava com policy `no` desde 01/05/2026 —
    # mesma armadilha que deixou o takenote-site 96 dias fora do ar. Não remover.
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # The landing must start even when the blog is down or unhealthy: no depends_on.
    labels:
      - traefik.enable=true
      - traefik.docker.network=debnet
      # HTTP
      - traefik.http.routers.devboot.rule=Host(`devboot.com.br`) || Host(`www.devboot.com.br`)
      - traefik.http.routers.devboot.entrypoints=web
      # HTTPS
      - traefik.http.routers.devboot-secure.rule=Host(`devboot.com.br`) || Host(`www.devboot.com.br`)
      - traefik.http.routers.devboot-secure.entrypoints=websecure
      - traefik.http.routers.devboot-secure.tls=true
      - traefik.http.routers.devboot-secure.tls.certresolver=le
      # Service
      - traefik.http.services.devboot.loadbalancer.server.port=80
    networks:
        - debnet
        - blog-internal

  blog:
    build: ./blog
    restart: unless-stopped
    environment:
      BLOG_API_TOKEN: ${BLOG_API_TOKEN:?Configure BLOG_API_TOKEN no arquivo .env}
      BLOG_BASE_URL: ${BLOG_BASE_URL:-https://www.devboot.com.br}
      BLOG_ALLOW_AUTO_PUBLISH: ${BLOG_ALLOW_AUTO_PUBLISH:-false}
      BLOG_OAUTH_ISSUER: ${BLOG_OAUTH_ISSUER:-}
      BLOG_OAUTH_JWKS_URL: ${BLOG_OAUTH_JWKS_URL:-}
    volumes:
      - blog-data:/data
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - blog-internal

networks:
  debnet:
    external: true
  blog-internal:

volumes:
  blog-data:
